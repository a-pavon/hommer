<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>🌍 Planeta AR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body { margin:0; overflow:hidden; background:#000; font-family:system-ui; }
        model-viewer {
            width: 100vw;
            height: 100vh;
            background-color: #000000;
        }
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center; color: white; background: rgba(0,0,0,0.75);
        }
        #overlay h1 { font-size: 3em; margin: 0 0 20px; }
        #overlay p { font-size: 1.3em; margin: 10px 0; }
        #arButton {
            margin-top: 40px; padding: 18px 50px; font-size: 1.6em;
            background: #00ff9d; color: #000; border: none;
            border-radius: 50px; font-weight: bold; box-shadow: 0 0 40px #00ff9d;
        }
    </style>
</head>
<body>

    <model-viewer id="viewer"
        src="https://raw.githubusercontent.com/google/model-viewer/master/packages/shared-assets/models/RobotExpressive.glb"
        ar
        ar-modes="scene-viewer webxr quick-look"
        camera-controls
        auto-rotate
        rotation-per-second="25deg"
        shadow-intensity="1"
        exposure="0.8"
        alt="Planeta girando en AR"
        style="background-color: #000000;">
    </model-viewer>

    <div id="overlay">
        <h1>🌍 Planeta AR</h1>
        <p><strong>1.</strong> Toca el botón verde</p>
        <p><strong>2.</strong> Apunta a piso o mesa con buena luz</p>
        <p><strong>3.</strong> El planeta aparece y gira automáticamente</p>
        <button id="arButton">🚀 VER EN AR</button>
    </div>

    <script>
        const viewer = document.getElementById('viewer');
        const overlay = document.getElementById('overlay');

        document.getElementById('arButton').addEventListener('click', () => {
            viewer.activateAR();
        });

        viewer.addEventListener('ar-status', (event) => {
            if (event.detail.status === 'session-started') {
                overlay.style.display = 'none';
            }
        });
    </script>
</body>
</html>
