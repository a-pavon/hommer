<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>🌍 Planeta AR con GPS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/three.js/build/ar-threex-location-only.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
    <style>
        body { margin:0; overflow:hidden; background:#000; }
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 100; display: flex; flex-direction: column;
            align-items: center; justify-content: center; text-align: center;
            color: white; background: rgba(0,0,0,0.85); font-family: system-ui;
        }
        button { margin-top: 30px; padding: 18px 50px; font-size: 1.6em;
            background: #00ff9d; color: #000; border: none;
            border-radius: 50px; font-weight: bold; box-shadow: 0 0 40px #00ff9d;
        }
        #info {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); padding: 12px 25px; border-radius: 15px;
            font-size: 1.1em; z-index: 101; display: none;
        }
    </style>
</head>
<body>

    <a-scene 
        vr-mode-ui="enabled: false" 
        arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false" 
        renderer="antialias: true; alpha: true">

        <!-- Cámara con GPS -->
        <a-camera gps-new-camera="gpsMinDistance: 5; positionMinAccuracy: 10"></a-camera>

        <!-- Planeta (se coloca 50m al norte) -->
        <a-entity id="planet" gps-new-entity-place="latitude: 0; longitude: 0" scale="25 25 25" position="0 15 0">
            <!-- Tierra -->
            <a-sphere radius="1" 
                src="https://www.solarsystemscope.com/textures/download/2k_earth_daymap.jpg"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 45000;">
            </a-sphere>
            <!-- Nubes -->
            <a-sphere radius="1.015" 
                src="https://www.solarsystemscope.com/textures/download/2k_earth_clouds.jpg"
                material="transparent: true; opacity: 0.9; side: double"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 32000;">
            </a-sphere>
        </a-entity>

    </a-scene>

    <!-- Pantalla inicial -->
    <div id="overlay">
        <h1>🌍 Planeta AR con GPS</h1>
        <p><strong>1.</strong> Toca el botón</p>
        <p><strong>2.</strong> Acepta cámara + ubicación</p>
        <p><strong>3.</strong> Sal afuera y apunta al norte</p>
        <button id="startBtn">🚀 ACTIVAR GPS + CÁMARA</button>
    </div>

    <div id="info">📍 Buscando tu ubicación...</div>

    <script>
        const overlay = document.getElementById('overlay');
        const info = document.getElementById('info');
        const planet = document.getElementById('planet');

        document.getElementById('startBtn').addEventListener('click', () => {
            if (!navigator.geolocation) {
                alert("❌ GPS no soportado");
                return;
            }

            overlay.style.display = 'none';
            info.style.display = 'block';

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const lat = pos.coords.latitude;
                    const lon = pos.coords.longitude;

                    // 50 metros al norte (aprox 0.00045 grados)
                    const planetLat = lat + 0.00045;
                    const planetLon = lon;

                    planet.setAttribute('gps-new-entity-place', `latitude: ${planetLat}; longitude: ${planetLon}`);

                    info.innerHTML = `✅ ¡Planeta colocado 50m al norte!<br>Apunta hacia el NORTE 🌍`;
                },
                (err) => {
                    alert("Error GPS: " + err.message + "\nPrueba al aire libre con datos/WiFi activados");
                    info.innerHTML = `❌ Error de ubicación`;
                },
                { enableHighAccuracy: true, timeout: 15000 }
            );
        });
    </script>
</body>
</html>
