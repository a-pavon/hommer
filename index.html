<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Prueba AR - Cubo 5m (Versión Corregida)</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    #info {
      position: absolute; top: 10px; left: 10px; color: white; background: rgba(0,0,0,0.85);
      padding: 15px; border-radius: 10px; font-family: Arial; z-index: 100; max-width: 90%;
    }
  </style>
</head>
<body>

  <div id="info">Obteniendo ubicación GPS...</div>

  <a-scene 
    vr-mode-ui="enabled: false" 
    arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;" 
    renderer="antialias: true; alpha: true">

    <a-camera gps-new-camera="gpsMinDistance: 3" rotation-reader></a-camera>

  </a-scene>

  <script>
    navigator.geolocation.getCurrentPosition(
      (position) => {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;

        document.getElementById('info').innerHTML = `
          ✅ GPS OK<br>
          Lat: ${lat.toFixed(6)}<br>
          Lon: ${lon.toFixed(6)}<br><br>
          <strong>INSTRUCCIONES:</strong><br>
          1. Gira el teléfono lentamente 360°<br>
          2. Camina 5-10 metros en cualquier dirección<br>
          3. Busca un cubo rojo gigante
        `;

        const scene = document.querySelector('a-scene');

        const box = document.createElement('a-box');
        box.setAttribute('gps-new-entity-place', `latitude: ${lat}; longitude: ${lon};`);
        box.setAttribute('material', 'color: red; emissive: #ff0000; emissiveIntensity: 0.6;');
        box.setAttribute('scale', '5 5 5');
        box.setAttribute('position', '0 3 0');           // elevado para que se vea mejor
        box.setAttribute('animation', 'property: scale; to: 5.3 5.3 5.3; dur: 800; easing: easeInOutSine; loop: true; dir: alternate;');

        scene.appendChild(box);
      },
      (error) => {
        document.getElementById('info').innerHTML = `❌ Error GPS: ${error.message}`;
      },
      { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }
    );
  </script>
</body>
</html>
