<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>🌍 Planeta AR - Tierra</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
        #instructions {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.75);
            color: white;
            padding: 15px 25px;
            border-radius: 15px;
            z-index: 100;
            text-align: center;
            max-width: 85%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <a-scene
        webxr="optionalFeatures: hit-test, local-floor;"
        ar-hit-test="target: #planet;"
        xr-mode-ui="enabled: true"
        background="color: #000000">

        <!-- Luces realistas -->
        <a-entity light="type: ambient; intensity: 0.8"></a-entity>
        <a-entity light="type: directional; intensity: 1.5; position: 5 10 5"></a-entity>

        <!-- El planeta (se coloca con un toque) -->
        <a-entity id="planet" scale="0.25 0.25 0.25" visible="false">
            <!-- Tierra -->
            <a-sphere
                radius="1"
                src="https://www.solarsystemscope.com/textures/download/2k_earth_daymap.jpg"
                material="roughness: 0.8; metalness: 0.1"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 45000; easing: linear">
            </a-sphere>

            <!-- Capa de nubes (gira más rápido) -->
            <a-sphere
                radius="1.015"
                src="https://www.solarsystemscope.com/textures/download/2k_earth_clouds.jpg"
                material="transparent: true; opacity: 0.85; side: double"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 32000; easing: linear">
            </a-sphere>
        </a-entity>

        <a-camera></a-camera>
    </a-scene>

    <!-- Instrucciones en pantalla -->
    <div id="instructions">
        <h2>🌍 Planeta AR</h2>
        <p><strong>1.</strong> Toca "Enter AR"<br>
           <strong>2.</strong> Apunta a una superficie plana<br>
           <strong>3.</strong> Toca la pantalla para colocar el planeta</p>
    </div>

    <script>
        const scene = document.querySelector('a-scene');
        const instructions = document.getElementById('instructions');

        // Ocultar instrucciones cuando se coloca el planeta
        scene.addEventListener('ar-hit-test-select', () => {
            instructions.style.display = 'none';
        });
    </script>
</body>
</html>
